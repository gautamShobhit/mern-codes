<!doctype html>
<html lang="en">
  <!-- The <head> contains information about the webpage and instructions/resources that the browser needs. -->
  <!-- Metadata usually isn't the main content users read on the page. It helps software understand and handle the page. -->
  <!-- <body> tells the user what the webpage contains; <head> helps the browser and other systems understand and handle the webpage. -->
  <head>
    <meta charset="UTF-8" />
    <!-- The viewport is essentially the area of the webpage that is currently visible to the user. -->

    <meta name="viewport" content="width=device-width, initial-scale=2.0" />
    <!-- A meta description is a short description of what a webpage is about. -->
    <meta
      name="description"
      content="Learn web development with our beginner-friendly courses."
    />

    <title>My College Website</title>
    <!-- <link> establishes a relationship between the current document and an external resource. -->

    <link rel="icon" href="./assets/favicon.png" />
    <!-- Small icon assigned to a tab which helps in recognising it -->
  </head>

  <body>
    <h1>Welcome to My College Website</h1>
  </body>
</html>
