<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      tr {
        padding: 10px;
      }
      th {
        padding: 10px;
      }
      td {
        padding: 10px;
      }
    </style>
    <title>Document</title>
  </head>
  <body>
    <table border="5">
      <caption>
        <!-- Small discription about the table -->
        Btech 1st Year Time Table
      </caption>
      <!-- First a row is created than we create separate cells in every row -->
      <tr>
        <th>Days</th>
        <th>9:00 - 10:00</th>
        <th>10:00 - 11:00</th>
        <th>11:00 - 12:00</th>
      </tr>
      <tr>
        <td>Monday</td>
        <!-- For combining cells of multiple adjacent columns -->
        <!-- Also values are given once when using rowspan or colspan -->
        <td style="text-align: center" colspan="2">TrainX</td>
        <!-- <td>TrainX</td> -->
        <td>Physics</td>
      </tr>
      <tr>
        <td>Tuesday</td>
        <!-- For combining cells of multiple adjacent rows -->
        <td rowspan="2">Maths</td>
        <td>Physics</td>
        <td>Chemistry</td>
      </tr>
      <tr>
        <td>Wednesday</td>
        <!-- 
        x<td>Maths</td> -->
        <td>TrainX</td>
        <td>Physics</td>
      </tr>
    </table>
  </body>
</html>
